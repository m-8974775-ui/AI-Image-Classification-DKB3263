<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Image Classification | DKB3263</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#202124}.container{max-width:850px;margin:40px auto;padding:24px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 5px 20px #0001}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,label{padding:12px 18px;border:0;border-radius:10px;background:#1a73e8;color:white;cursor:pointer;font-weight:600}input{display:none}video,img{max-width:100%;border-radius:12px;margin-top:15px}.result{margin-top:20px;padding:18px;border-radius:12px;background:#f1f3f4}.prediction{font-size:28px;font-weight:700}.confidence{font-size:20px;margin-top:8px}.low{background:#fce8e6}.good{background:#e6f4ea}.hidden{display:none}.bar{height:12px;background:#ddd;border-radius:10px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:#1a73e8}.small{color:#5f6368;font-size:14px}
  </style>
</head>
<body>
<div class="container"><div class="card">
  <h1>AI Image Classification</h1>
  <p>DKB3263 • Google Teachable Machine</p>
  <p class="small">Upload an image or use your webcam to run an image-classification prediction.</p>
  <div class="controls">
    <label>Upload Image<input id="file" type="file" accept="image/*"></label>
    <button id="webcamBtn">Start Webcam</button>
    <button id="resetBtn">Reset</button>
  </div>
  <div id="media"></div>
  <div id="status" class="result">Loading model…</div>
</div></div>
<script>
const MODEL_URL='https://teachablemachine.withgoogle.com/models/YOrkzhUi-/';
let model, webcam, running=false;
const media=document.getElementById('media'), statusBox=document.getElementById('status');
async function loadModel(){
  try{model=await tmImage.load(MODEL_URL+'model.json',MODEL_URL+'metadata.json'); statusBox.textContent='Model loaded. Choose an image or start the webcam.';}
  catch(e){statusBox.textContent='Unable to load the Teachable Machine model. Check the model URL and internet connection.'; console.error(e);}
}
async function predict(source){
  if(!model)return;
  const predictions=await model.predict(source);
  predictions.sort((a,b)=>b.probability-a.probability);
  const p=predictions[0], confidence=p.probability*100;
  statusBox.className='result '+(confidence<60?'low':'good');
  statusBox.innerHTML='<div class="prediction">'+escapeHtml(p.className)+'</div><div class="confidence">Confidence: '+confidence.toFixed(2)+'%</div><div class="bar"><div class="fill" style="width:'+confidence+'%"></div></div><p class="small">'+(confidence<60?'Low confidence — treat this prediction as uncertain.':'Prediction confidence is above the low-confidence threshold.')+'</p>';
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
document.getElementById('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return; if(running){running=false;try{webcam.stop()}catch(_){}} const img=document.createElement('img');img.src=URL.createObjectURL(f);media.innerHTML='';media.appendChild(img);img.onload=()=>predict(img);});
document.getElementById('webcamBtn').addEventListener('click',async()=>{if(!model)return;if(running){running=false;try{webcam.stop()}catch(_){ } document.getElementById('webcamBtn').textContent='Start Webcam';return;} webcam=new tmImage.Webcam(640,480,true);await webcam.setup();await webcam.play();running=true;media.innerHTML='';media.appendChild(webcam.canvas);document.getElementById('webcamBtn').textContent='Stop Webcam';requestAnimationFrame(loop);});
async function loop(){if(!running)return;webcam.update();await predict(webcam.canvas);requestAnimationFrame(loop);}
document.getElementById('resetBtn').addEventListener('click',()=>{running=false;try{if(webcam)webcam.stop()}catch(_){} media.innerHTML='';statusBox.className='result';statusBox.textContent='Ready for a new prediction.';document.getElementById('file').value='';document.getElementById('webcamBtn').textContent='Start Webcam';});
loadModel();
</script>
</body></html>
